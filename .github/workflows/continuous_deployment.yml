name: 3. Continuous Deployment - Deploy Serving API

on:
  workflow_run:
    workflows: ["2. Continuous Delivery - Train, Test Staging & Promote"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy-api:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest Serving Image & Restart API Container
        run: |
          docker compose -f docker/docker-compose.yml pull api
          docker compose -f docker/docker-compose.yml up -d --force-recreate api

      - name: Verify API Health Endpoint
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:8000/health | grep -q '"model_loaded":"True"' && exit 0
            sleep 5
          done
          docker logs flight_api_prod
          exit 1

      - name: Cleanup old Docker images
        if: always()
        run: |
          docker image prune -f