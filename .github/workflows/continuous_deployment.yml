name: 3. Continuous Deployment - Flight Delay API

on:
  push:
    branches: [ "main", "feat/api-docker" ]
  workflow_dispatch:

jobs:
  deploy-to-vm2:
    runs-on: self-hosted  # inside VM2!

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare Data Splits & Train Baseline Model (if missing)
        run: |
          if [ ! -f models/model.joblib ]; then
            echo "Generating model on VM2..."
            pip install -r requirements.txt
            dvc pull data/processed/flights_2022_2023.parquet --force
            python3 -m src.data.prepare_splits --config configs/train.yaml 
            python3 -m src.modeling.train --config configs/train.yaml --max-train-rows 50000 --no-mlflow
          fi

      - name: Build & Restart Production Docker Container
        run: |
          docker build -t flights-api:latest .
          docker stop flights_api_prod || true
          docker rm flights_api_prod || true
          docker run -d \
            --name flights_api_prod \
            -p 8000:8000 \
            -e MLFLOW_TRACKING_URI="http://10.17.0.190:5050" \
            --restart always \
            flights-api:latest

      - name: Verify Live Health Endpoint
        run: |
          sleep 5
          curl -f http://localhost:8000/health