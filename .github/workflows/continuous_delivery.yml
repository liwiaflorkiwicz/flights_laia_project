name: 2. Continuous Delivery - Train Model & Build Image

on:
  push:
    branches: [ "main", "feat/api-docker" ]
  workflow_dispatch:

#env:
#  MLFLOW_TRACKING_URI: "http://10.17.0.190:5050"
#  MLFLOW_EXPERIMENT_NAME: "flight-delay-severity"

jobs:
  train-and-package:
    runs-on: self-hosted

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Build Training and Serving Images
        run: |
          docker compose --profile training build

      - name: Run Training Container (DVC Pull -> Splits -> Train -> MLflow Register)
        run: |
          docker compose --profile training run --rm trainer \
            --config configs/train.yaml \
            --max-train-rows 100000 \
            --run-name "CD-${{ github.sha }}"

      - name: Restart Production Serving Container (Pulls Latest Model from MLflow)
        run: |
          docker compose up -d --force-recreate api

      - name: Cleanup old Docker layers
        if: always()
        run: |
          docker image prune -f