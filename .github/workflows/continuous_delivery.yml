name: 2. Continuous Delivery - Train & Register Model

on:
  workflow_run:
    workflows: ["1. Continuous Integration - Test & Build Images"]
    types: [completed]
  workflow_dispatch:

jobs:
  train-model:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest Training Image
        run: |
          docker compose --profile training pull trainer

      - name: Run Containerized Training (DVC -> Splits -> Train -> MLflow)
        run: |
          docker compose --profile training run --rm trainer \
            --config configs/train.yaml \
            --max-train-rows 100000 \
            --run-name "CD-${{ github.sha }}"