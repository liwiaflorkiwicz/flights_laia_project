name: Continuous Delivery - Flight Delay API

on:
  push:
    branches: [ "main", "feat/api-docker" ]
  workflow_dispatch:

jobs:
  train-and-package-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare Data Splits & Train Model
        run: |
          python -m src.data.prepare_splits --config configs/train.yaml || true

      - name: Train Flight Delay Model
        run: |
          python -m src.modeling.train --config configs/train.yaml --max-train-rows 100000 --no-mlflow

      - name: Upload Trained Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-artifact
          path: models/model.joblib
          retention-days: 7