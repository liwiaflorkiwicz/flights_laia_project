name: 2. Continuous Delivery - Train Model & Build Image

on:
  push:
    branches: [ "main", "feat/api-docker" ]
  workflow_dispatch:

env:
  MLFLOW_TRACKING_URI: "http://10.17.0.190:5050"
  MLFLOW_EXPERIMENT_NAME: "flight-delay-severity"

jobs:
  train-and-package:
    runs-on: self-hosted

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc[ssh]"

      - name: Pull Dataset via DVC
        run: |
          dvc pull data/processed/flights_2022_2023.parquet --force

      - name: Prepare Data Splits
        run: |
          python -m src.data.prepare_splits --config configs/train.yaml

      - name: Train Flight Delay Model
        env:
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
          MLFLOW_EXPERIMENT_NAME: ${{ env.MLFLOW_EXPERIMENT_NAME }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python -m src.modeling.train --config configs/train.yaml --max-train-rows 100000  --run-name "CD-${{ github.sha }}"

      - name: Build Docker Image (Delivery Check)
        run: |
          docker build -f docker/Dockerfile -t flights-api:latest .

      #- name: Deploy API Container
      #  run: |
      #    docker compose down || true
      #    docker compose up -d --build

      - name: Upload Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-artifact
          path: models/model.joblib
          retention-days: 7

      - name: Clean up Docker system
        run: |
          docker image prune -f