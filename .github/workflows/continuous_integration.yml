name: Continuous Integration - Flight Delay API

on:
  push:
    branches: [ "main", "feat/api-docker", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure dummy model exists for testing
        run: |
          if [ ! -f models/model.joblib ]; then
            echo "Generating lightweight dummy model for pytest..."
            python -m src.modeling.train --config configs/train.yaml --max-train-rows 10000 --no-mlflow
          fi

      - name: Run unit & integration tests
        run: |
          pytest tests/

      - name: Build Docker Image
        run: |
          docker build -t flights-api:latest .