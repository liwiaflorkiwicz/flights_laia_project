name: 1. Continuous Integration - Flight Delay API

on:
  push:
    branches: [ "main", "feat/api-docker", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name : Lint Python Code
        run: |
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Generate dummy model for local API tests
        run: |
          mkdir -p models
          python -m src.modeling.train --config configs/train.yaml --max-train-rows 5000 --no-mlflow

      - name: Run unit & integration tests
        env:
          LOCAL_MODEL_PATH: "models/model.joblib"
        run: |
          pytest tests/ -v

      - name: Build Training Docker Image (Smoke Check)
        run: |
          docker build -f docker/Dockerfile.train -t flights-trainer:ci-test .

      - name: Build Serving Docker Image (Smoke Check)
        run: |
          docker build -f docker/Dockerfile.serve -t flights-serving:ci-test .